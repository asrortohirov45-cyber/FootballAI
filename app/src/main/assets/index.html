<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOOTBALL AI PRO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    background: #08111f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 20px 0;
}

header h1 {
    color: #00e676;
    font-size: 27px;
}

header p {
    color: #9eacc0;
}

.card {
    background: #142238;
    padding: 17px;
    border-radius: 14px;
    margin-bottom: 15px;
}

button {
    background: #00c853;
    border: none;
    color: #001b0a;
    padding: 13px;
    border-radius: 9px;
    font-weight: bold;
    font-size: 15px;
    width: 100%;
    margin-top: 10px;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: 1px solid #34465f;
    background: #0b1728;
    color: white;
    margin-top: 10px;
}

h2 {
    color: #00e676;
    font-size: 18px;
}

#result {
    color: #d4e0ef;
    line-height: 1.6;
}
</style>
</head>

<body>

<header>
    <h1>⚽ FOOTBALL AI PRO</h1>
    <p>Sun'iy intellekt asosidagi futbol tahlili</p>
</header>

<div class="card">
    <h2>API sozlamalari</h2>
    <input id="apiKey" type="password"
    placeholder="API-Football kalitini kiriting">
</div>

<div class="card">
    <h2>Uchrashuvlar</h2>
    <button onclick="loadMatches(0)">BUGUNGI O‘YINLAR</button>
    <button onclick="loadMatches(1)">ERTANGI O‘YINLAR</button>
</div>

<div class="card">
    <h2>📊 Futbol tahlili</h2>
    <div id="result">
        Tahlil qilish uchun kunni tanlang.
    </div>
</div>

<script>
async function loadMatches(offset) {
    const key = document.getElementById("apiKey").value.trim();
    const result = document.getElementById("result");

    if (!key) {
        result.innerText = "Avval API kalitini kiriting!";
        return;
    }

    const date = new Date();
    date.setDate(date.getDate() + offset);

    const day = date.getDate().toString().padStart(2, "0");
    const month = (date.getMonth()+1).toString().padStart(2, "0");
    const year = date.getFullYear();

    const dateText = `${year}-${month}-${day}`;

    result.innerText = "Uchrashuvlar yuklanmoqda...";

    try {
        const response = await fetch(
            `https://v3.football.api-sports.io/fixtures?date=${dateText}&timezone=Asia/Tashkent`,
            {
                headers: {
                    "x-apisports-key": key
                }
            }
        );

        const data = await response.json();

        if (data.errors && Object.keys(data.errors).length) {
            throw new Error(JSON.stringify(data.errors));
        }

        const matches = data.response || [];

        if (matches.length === 0) {
            result.innerText = "Uchrashuvlar topilmadi.";
            return;
        }

        result.innerHTML = `<b>${dateText}</b><br><br>`;

        matches.forEach(match => {
            const home = match.teams.home.name;
            const away = match.teams.away.name;
            const league = match.league.name;
            const score = match.goals.home === null
                ? "VS"
                : `${match.goals.home} : ${match.goals.away}`;

            result.innerHTML += `
                <div class="card">
                    <b>${home} ${score} ${away}</b><br>
                    ${league}<br>
                    ${match.fixture.date.substring(11,16)}
                </div>
            `;
        });

    } catch (error) {
        result.innerText = "Xatolik: " + error.message;
    }
}
</script>

</body>
</html>
